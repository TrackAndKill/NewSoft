# Sample nginx vhost for firm.profithub.me when you already run nginx on this VM.
# Use this instead of the Caddyfile if your VM's port 80/443 is owned by nginx.
#
# Setup:
#   1. sudo apt-get install -y apache2-utils  # for htpasswd
#   2. sudo htpasswd -c /etc/nginx/.newsoft_htpasswd founder
#   3. sudo cp infra/nginx-newsoft.conf /etc/nginx/sites-available/newsoft
#   4. sudo ln -s /etc/nginx/sites-available/newsoft /etc/nginx/sites-enabled/newsoft
#   5. sudo certbot --nginx -d firm.profithub.me   # provisions TLS
#   6. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name firm.profithub.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name firm.profithub.me;

    # Certs managed by certbot; the file paths below are what certbot writes.
    # ssl_certificate     /etc/letsencrypt/live/firm.profithub.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/firm.profithub.me/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "NewSoft";
    auth_basic_user_file /etc/nginx/.newsoft_htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Dashboard (Next.js)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
